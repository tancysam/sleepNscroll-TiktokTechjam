[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "kuairand-agent"
version = "0.1.0"
description = "A local, leakage-safe autonomous ML research agent for KuaiRand-Pure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "TikTok TechJam team" }]
dependencies = [
  "numpy==2.5.2",
  "psutil==7.2.2",
]

[project.scripts]
kuairand-agent = "kuairand_agent.cli:entrypoint"

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pytest==9.1.1",
  "pytest-cov==6.3.0",
  "ruff==0.15.22",
]
research-neural = [
  "torch==2.13.0",
]
research-tree = [
  "lightgbm==4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kuairand_agent"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["kuairand_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
