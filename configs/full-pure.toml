schema_version = 4

[benchmark]
name = "kuairand-pure"
data_dir = ".data/KuaiRand-Pure/data"
starter_dir = "kuairand-starter-kit"
target = "long_view"
max_iterations = 50
wall_clock_seconds = 21600
epsilon = 0.002
convergence_patience = 3

[validation]
outer_promotion_limit = 6
confirmation_seeds = [0, 1, 2]
inner_folds = ["20220416:20220418", "20220419:20220421"]

[runner]
device = "cpu"
max_processes = 1
threads = 4
memory_mb = 16384
disk_mb = 20480
default_timeout_seconds = 1800
finalization_reserve_seconds = 3600

[research]
provider = "openai"
max_repairs_per_experiment = 2
run_kind = "autonomous"
allow_scripted_demo = false

[research.openai]
reasoning_effort = "high"
timeout_seconds = 600.0
max_response_bytes = 8388608
# OpenRouter reserves credit for the FULL requested output before running anything, so this
# value sets a floor on the account balance a campaign needs: at 65536 it returned
# "requires more credits, or fewer max_tokens ... can only afford 57565" and failed every
# propose call. The largest completion any real call has produced in this project is 17328
# tokens, so 32768 keeps roughly a 2x margin while halving the reservation.
max_output_tokens = 32768
max_malformed_retries = 1
max_transport_retries = 1

[research.openai.main]
api_key_env = "INFERENCE_MAIN_API_KEY"
base_url_env = "INFERENCE_MAIN_BASE_URL"
model_env = "INFERENCE_MAIN_MODEL"
response_format = "json_schema"
max_tokens_parameter = "max_completion_tokens"
send_reasoning_effort = true

# openai/gpt-5.6-sol as served by TokenRouter, which publishes no pricing for it. These are the
# rates this project has always assumed for the model and are carried forward unchanged, so
# reported spend for it is an ESTIMATE against published list rates rather than a served rate.
# The fallback block below is a measured rate and is exact.
[research.openai.main.pricing]
input_usd_per_million = "4.00"
cached_input_usd_per_million = "0.40"
output_usd_per_million = "20.00"

[research.openai.fallback]
api_key_env = "INFERENCE_FALLBACK_API_KEY"
base_url_env = "INFERENCE_FALLBACK_BASE_URL"
model_env = "INFERENCE_FALLBACK_MODEL"
response_format = "json_schema"
max_tokens_parameter = "max_completion_tokens"
send_reasoning_effort = true

# deepseek/deepseek-v4-pro-0813 as served by OpenRouter, read from its models endpoint and
# verified against a live call's reported upstream cost.
[research.openai.fallback.pricing]
input_usd_per_million = "0.66"
cached_input_usd_per_million = "0.022"
output_usd_per_million = "1.98"
